[tool.black]
line-length = 119
target-version = ['py311']
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | env
  | migrations
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 119
skip = [
    "migrations",
    ".venv",
    "venv",
    "env"
]
known_django = "django"
sections = [
    "FUTURE",
    "STDLIB",
    "DJANGO",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER"
]