services:
  web:
    image: baistepan/library:${IMAGE_TAG:-latest}
    command: sh -c "gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - static_volume:/app/staticfiles
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build: ./nginx
    ports:
      - "82:80"
    volumes:
      - static_volume:/app/staticfiles
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

  worker:
    image: baistepan/library:${IMAGE_TAG:-latest}
    command: celery -A config worker -l info
    env_file:
      - .env
    depends_on:
      - redis
      - db

  beat:
    image: baistepan/library:${IMAGE_TAG:-latest}
    command: celery -A config beat -l info
    env_file:
      - .env
    depends_on:
      - redis
      - db

  db:
    image: postgres:16
    env_file:
      - .env
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis
    volumes:
      - redis_volume:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  static_volume:
  redis_volume: